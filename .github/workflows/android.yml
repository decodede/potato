name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK and release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # create the rolling release with the APKs on main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the pinned CloudStream library
        run: ./scripts/fetch-upstream.sh

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Write release keystore (only when the secret is set)
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "CS_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "CS_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "CS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "CS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          fi

      - name: Build the APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect the APKs
        run: |
          mkdir -p build/apk
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "build/apk/potatoflix-android-$abi.apk"
          done
          ls -la build/apk

      - name: Upload the APKs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: potatoflix-android
          path: build/apk/*.apk

      - name: Publish the rolling release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: potatoflix-latest
          name: Potatoflix — latest build (${{ github.sha }})
          body: |
            Rolling build of Potatoflix (Android and Android TV) from `main`.

            - `potatoflix-android-arm64-v8a.apk` — most phones and newer TVs
            - `potatoflix-android-armeabi-v7a.apk` — older Android TV boxes and Fire TV sticks
            - `potatoflix-android-x86_64.apk` / `potatoflix-android-x86.apk` — emulators
            - `potatoflix-android-universal.apk` — all of the above (larger)

            Built from ${{ github.sha }}.
          files: build/apk/*.apk
          overwrite_files: true
          generate_release_notes: false
